name: Safe thread summary monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run monitor once
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          STATE_FILE: state.json
          SUMMARY_DIR: daily_summary
          REQUEST_TIMEOUT: "15"
          HOT_ALERT_THRESHOLD: "1"
          DAILY_DIGEST_HOUR: "20"
        run: python crawler.py

      - name: Persist safe monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json daily_summary/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update safe monitor state"
          git push
