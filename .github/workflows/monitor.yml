name: Safe thread summary monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/45 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: |
            .runtime-state/state.json
            .runtime-state/daily_summary
          key: safe-thread-state-${{ github.run_id }}
          restore-keys: |
            safe-thread-state-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run monitor once
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          STATE_FILE: .runtime-state/state.json
          SUMMARY_DIR: .runtime-state/daily_summary
          REQUEST_TIMEOUT: "15"
        run: python crawler.py
